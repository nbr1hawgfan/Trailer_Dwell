<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pernod Ricard Trailer Dwell</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f4f5f6">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f4f5f6;
    --bg-elevated: #ffffff;
    --bg-card: #ffffff;
    --border: #dde1e4;
    --text: #1a1c1e;
    --text-dim: #6b7278;
    --accent: #2f7de1;
    --good: #2e7d32;
    --warn: #b8790f;
    --bad: #c62828;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
  }

  [data-theme="dark"] {
    --bg: #121212;
    --bg-elevated: #1c1c1c;
    --bg-card: #202020;
    --border: #333333;
    --text: #e8e8e8;
    --text-dim: #999999;
    --accent: #4a9eff;
    --good: #4caf50;
    --warn: #d9a441;
    --bad: #d9534f;
    --shadow: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 40px;
  }

  header {
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 500;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
  }

  header .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 2px;
  }

  .stats-bar {
    display: flex;
    gap: 12px;
    padding: 16px 20px 8px 20px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    flex: 1;
    min-width: 130px;
    box-shadow: var(--shadow);
  }

  .stat-card .value {
    font-size: 26px;
    font-weight: 700;
  }

  .stat-card .label {
    color: var(--text-dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-top: 4px;
  }

  .stat-card.warn .value { color: var(--warn); }
  .stat-card.bad .value { color: var(--bad); }

  #map {
    height: 460px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #2a2a2a;
    box-shadow: var(--shadow);
  }

  .section {
    padding: 20px;
  }

  .section h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text);
  }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 20px;
    margin-bottom: 4px;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .tab-btn.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  th {
    text-align: left;
    padding: 10px 12px;
    background: var(--bg-elevated);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  th:hover { color: var(--text); }

  td {
    padding: 12px;
    border-top: 1px solid var(--border);
    font-size: 14px;
  }

  tr:hover td { background: rgba(255,255,255,0.02); }

  .dwell-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .dwell-good { background: rgba(76,175,80,0.15); color: var(--good); }
  .dwell-warn { background: rgba(217,164,65,0.15); color: var(--warn); }
  .dwell-bad { background: rgba(217,83,79,0.15); color: var(--bad); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .refresh-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 20px;
    margin-top: 4px;
  }

  .refresh-row .last-updated {
    color: var(--text-dim);
    font-size: 12px;
  }

  .refresh-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }

  .refresh-btn:active { transform: scale(0.97); }

  .export-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .filter-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 12px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  .filter-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    flex: 1;
    min-width: 160px;
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .filter-field label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .filter-input-small {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 8px;
    font-size: 13px;
    width: 130px;
  }

  .filter-count {
    color: var(--text-dim);
    font-size: 12px;
    margin: -4px 0 10px 2px;
  }

  .theme-toggle {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .hidden { display: none; }

  .error-banner {
    margin: 20px;
    padding: 14px 16px;
    background: rgba(217,83,79,0.12);
    border: 1px solid rgba(217,83,79,0.3);
    border-radius: 10px;
    color: var(--bad);
    font-size: 13px;
  }

  @media (max-width: 480px) {
    #map { height: 340px; }
    th, td { font-size: 12px; padding: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <h1>Pernod Ricard Trailer Dwell</h1>
      <div class="subtitle">7401 State Hwy 45, Fort Smith, AR</div>
    </div>
    <button class="theme-toggle" id="themeToggle">Dark</button>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="refresh-row">
  <span class="last-updated" id="lastUpdated">Loading...</span>
  <button class="refresh-btn" id="refreshBtn">Refresh</button>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="onsite">On Site</button>
  <button class="tab-btn" data-tab="departed">Recently Departed</button>
  <button class="tab-btn" data-tab="visits">Visits</button>
  <button class="tab-btn" data-tab="map">Map</button>
</div>

<div class="section" id="onsiteSection">
  <div class="filter-row">
    <input type="text" id="onsiteSearch" class="filter-input" placeholder="Search trailer name or ID...">
    <div class="filter-field">
      <label for="onsiteMinHours">Min hours on site</label>
      <input type="number" id="onsiteMinHours" class="filter-input-small" min="0" step="1" placeholder="0">
    </div>
    <button class="refresh-btn" id="onsiteClearFilters">Clear</button>
  </div>
  <div class="filter-count" id="onsiteFilterCount"></div>
  <div class="export-row">
    <button class="refresh-btn" id="exportOnSiteBtn">Export CSV</button>
  </div>
  <div id="onsiteTableWrap"></div>
</div>

<div class="section hidden" id="departedSection">
  <div class="filter-row">
    <input type="text" id="departedSearch" class="filter-input" placeholder="Search trailer name or ID...">
    <div class="filter-field">
      <label for="departedStart">From</label>
      <input type="date" id="departedStart" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="departedEnd">To</label>
      <input type="date" id="departedEnd" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="departedMinHours">Min dwell (hrs)</label>
      <input type="number" id="departedMinHours" class="filter-input-small" min="0" step="1" placeholder="0">
    </div>
    <button class="refresh-btn" id="departedClearFilters">Clear</button>
  </div>
  <div class="filter-count" id="departedFilterCount"></div>
  <div class="export-row">
    <button class="refresh-btn" id="exportDwellLogBtn">Export Filtered CSV</button>
    <button class="refresh-btn" id="exportDwellLogFullBtn">Export Full History CSV</button>
  </div>
  <div id="departedTableWrap"></div>
</div>

<div class="section hidden" id="visitsSection">
  <div class="filter-row">
    <input type="text" id="visitsSearch" class="filter-input" placeholder="Search trailer name or ID...">
    <div class="filter-field">
      <label for="visitsStart">From</label>
      <input type="date" id="visitsStart" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="visitsEnd">To</label>
      <input type="date" id="visitsEnd" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="visitsMinHours">Min duration (hrs)</label>
      <input type="number" id="visitsMinHours" class="filter-input-small" min="0" step="1" placeholder="0">
    </div>
    <button class="refresh-btn" id="visitsClearFilters">Clear</button>
  </div>
  <div class="filter-count" id="visitsFilterCount"></div>
  <div class="export-row">
    <button class="refresh-btn" id="exportVisitsBtn">Export Filtered CSV</button>
    <button class="refresh-btn" id="exportVisitsFullBtn">Export Full History CSV</button>
  </div>
  <div id="visitsTableWrap"></div>
</div>

<div class="section hidden" id="mapSection">
  <div id="map"></div>
</div>

<div id="errorBanner" class="error-banner hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ============================================================
// CONFIG — paste your two published-CSV URLs here
// File > Share > Publish to web, per-sheet, format CSV, on the
// "Current Status" and "Dwell Log" tabs.
// ============================================================
const CURRENT_STATUS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxbZXyc8eN8KxGAA-eLkghoFHpPkeFdrUFCm9xrlaJtfmaJM-HBPA8cjRvQ5Kh9ySdiw3Wm9OSYpT/pub?gid=450264095&single=true&output=csv';
const DWELL_LOG_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxbZXyc8eN8KxGAA-eLkghoFHpPkeFdrUFCm9xrlaJtfmaJM-HBPA8cjRvQ5Kh9ySdiw3Wm9OSYpT/pub?gid=947795419&single=true&output=csv';
const VISITS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxbZXyc8eN8KxGAA-eLkghoFHpPkeFdrUFCm9xrlaJtfmaJM-HBPA8cjRvQ5Kh9ySdiw3Wm9OSYpT/pub?gid=1735900058&single=true&output=csv';

const SITE_CENTER = { lat: 35.3122, lng: -94.3843 }; // approx Pernod Ricard yard
const REFRESH_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes
const WARN_HOURS = 24;
const BAD_HOURS = 48;

// ---- CSV parsing (handles quoted fields with commas) ----
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }

  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(c => c && c.trim())).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] || '').trim());
    return obj;
  });
}

async function fetchCSV(url) {
  const resp = await fetch(url + (url.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
  if (!resp.ok) throw new Error('Fetch failed: ' + resp.status);
  const text = await resp.text();
  return parseCSV(text);
}

function hoursLabel(h) {
  const n = parseFloat(h);
  if (isNaN(n)) return '—';
  const hrs = Math.floor(n);
  const mins = Math.round((n - hrs) * 60);
  return hrs + 'h ' + mins + 'm';
}

function dwellClass(hours) {
  const n = parseFloat(hours);
  if (isNaN(n)) return 'dwell-good';
  if (n >= BAD_HOURS) return 'dwell-bad';
  if (n >= WARN_HOURS) return 'dwell-warn';
  return 'dwell-good';
}

function fmtDateTime(d) {
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d || '—';
  return dt.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

let map, markersLayer;

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([SITE_CENTER.lat, SITE_CENTER.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function colorForHours(hours) {
  const n = parseFloat(hours);
  if (isNaN(n)) return '#4caf50';
  if (n >= BAD_HOURS) return '#d9534f';
  if (n >= WARN_HOURS) return '#d9a441';
  return '#4caf50';
}

function updateMap(trailers) {
  markersLayer.clearLayers();

  trailers.forEach(t => {
    const lat = parseFloat(t['Latitude']);
    const lng = parseFloat(t['Longitude']);
    if (isNaN(lat) || isNaN(lng)) return;

    const color = colorForHours(t['Hours On Site']);
    const marker = L.circleMarker([lat, lng], {
      radius: 9,
      fillColor: color,
      color: '#121212',
      weight: 2,
      fillOpacity: 0.9
    });

    marker.bindPopup(
      '<strong>' + t['Trailer Name'] + '</strong><br>' +
      'On site: ' + hoursLabel(t['Hours On Site']) + '<br>' +
      'Arrived: ' + fmtDateTime(t['Arrival Time'])
    );

    marker.addTo(markersLayer);
  });

  if (trailers.length) {
    const validPts = trailers
      .map(t => [parseFloat(t['Latitude']), parseFloat(t['Longitude'])])
      .filter(p => !isNaN(p[0]) && !isNaN(p[1]));
    if (validPts.length) {
      map.fitBounds(validPts, { padding: [40, 40], maxZoom: 17 });
    }
  }
}

function renderStats(trailers) {
  const count = trailers.length;
  const hoursArr = trailers.map(t => parseFloat(t['Hours On Site'])).filter(n => !isNaN(n));
  const avg = hoursArr.length ? hoursArr.reduce((a, b) => a + b, 0) / hoursArr.length : 0;
  const longest = hoursArr.length ? Math.max(...hoursArr) : 0;
  const stuck = hoursArr.filter(h => h >= BAD_HOURS).length;

  const bar = document.getElementById('statsBar');
  bar.innerHTML = `
    <div class="stat-card">
      <div class="value">${count}</div>
      <div class="label">On Site</div>
    </div>
    <div class="stat-card">
      <div class="value">${hoursLabel(avg)}</div>
      <div class="label">Avg Dwell</div>
    </div>
    <div class="stat-card ${longest >= BAD_HOURS ? 'bad' : longest >= WARN_HOURS ? 'warn' : ''}">
      <div class="value">${hoursLabel(longest)}</div>
      <div class="label">Longest On Site</div>
    </div>
    <div class="stat-card ${stuck > 0 ? 'bad' : ''}">
      <div class="value">${stuck}</div>
      <div class="label">Over 48h</div>
    </div>
  `;
}

let sortState = { key: 'Hours On Site', dir: 'desc' };
let lastTrailers = [];
let lastDwellLog = [];
let lastFilteredOnSite = [];
let lastFilteredDeparted = [];
let lastVisits = [];
let lastFilteredVisits = [];

function applyOnSiteFilters(trailers) {
  const search = (document.getElementById('onsiteSearch').value || '').trim().toLowerCase();
  const minHours = parseFloat(document.getElementById('onsiteMinHours').value);

  return trailers.filter(t => {
    if (search) {
      const haystack = ((t['Trailer Name'] || '') + ' ' + (t['Trailer ID'] || '')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    if (!isNaN(minHours) && minHours > 0) {
      const h = parseFloat(t['Hours On Site']) || 0;
      if (h < minHours) return false;
    }
    return true;
  });
}

function renderOnSiteTable(trailers) {
  const wrap = document.getElementById('onsiteTableWrap');
  const filtered = applyOnSiteFilters(trailers);
  lastFilteredOnSite = filtered;

  updateFilterCount('onsiteFilterCount', filtered.length, trailers.length);

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty-state">' +
      (trailers.length ? 'No trailers match the current filters.' : 'No trailers currently on site.') +
      '</div>';
    return;
  }

  const sorted = [...filtered].sort((a, b) => {
    let av = a[sortState.key], bv = b[sortState.key];
    if (sortState.key === 'Hours On Site') { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; }
    if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
    if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
    return 0;
  });

  let html = '<table><thead><tr>' +
    '<th data-key="Trailer Name">Trailer</th>' +
    '<th data-key="Arrival Time">Arrived</th>' +
    '<th data-key="Hours On Site">Dwell Time</th>' +
    '</tr></thead><tbody>';

  sorted.forEach(t => {
    html += '<tr>' +
      '<td>' + (t['Trailer Name'] || t['Trailer ID']) + '</td>' +
      '<td>' + fmtDateTime(t['Arrival Time']) + '</td>' +
      '<td><span class="dwell-badge ' + dwellClass(t['Hours On Site']) + '">' + hoursLabel(t['Hours On Site']) + '</span></td>' +
      '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      else { sortState.key = key; sortState.dir = 'desc'; }
      renderOnSiteTable(trailers);
    });
  });
}

function applyDepartedFilters(dwellLog) {
  const search = (document.getElementById('departedSearch').value || '').trim().toLowerCase();
  const startVal = document.getElementById('departedStart').value;
  const endVal = document.getElementById('departedEnd').value;
  const minHours = parseFloat(document.getElementById('departedMinHours').value);

  const start = startVal ? new Date(startVal + 'T00:00:00') : null;
  const end = endVal ? new Date(endVal + 'T23:59:59') : null;

  return dwellLog.filter(r => {
    if (r['Event Type'] !== 'Departure') return false;

    const eventTime = new Date(r['Event Time']);
    if (start && eventTime < start) return false;
    if (end && eventTime > end) return false;

    if (search) {
      const haystack = ((r['Trailer Name'] || '') + ' ' + (r['Trailer ID'] || '')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }

    if (!isNaN(minHours) && minHours > 0) {
      const h = parseFloat(r['Duration (hrs)']) || 0;
      if (h < minHours) return false;
    }

    return true;
  }).sort((a, b) => new Date(b['Event Time']) - new Date(a['Event Time']));
}

function renderDepartedTable(dwellLog) {
  const wrap = document.getElementById('departedTableWrap');
  const departures = applyDepartedFilters(dwellLog);
  lastFilteredDeparted = departures;

  const totalDepartures = dwellLog.filter(r => r['Event Type'] === 'Departure').length;
  updateFilterCount('departedFilterCount', departures.length, totalDepartures);

  if (!departures.length) {
    wrap.innerHTML = '<div class="empty-state">' +
      (totalDepartures ? 'No departures match the current filters.' : 'No departures logged yet.') +
      '</div>';
    return;
  }

  let html = '<table><thead><tr>' +
    '<th>Trailer</th><th>Departed</th><th>Total Dwell</th>' +
    '</tr></thead><tbody>';

  departures.forEach(d => {
    html += '<tr>' +
      '<td>' + (d['Trailer Name'] || d['Trailer ID']) + '</td>' +
      '<td>' + fmtDateTime(d['Event Time']) + '</td>' +
      '<td><span class="dwell-badge ' + dwellClass(d['Duration (hrs)']) + '">' + hoursLabel(d['Duration (hrs)']) + '</span></td>' +
      '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function mapLink_(lat, lng) {
  const la = parseFloat(lat), ln = parseFloat(lng);
  if (isNaN(la) || isNaN(ln)) return '<span style="color:var(--text-dim);">—</span>';
  return '<a href="https://www.google.com/maps?q=' + la + ',' + ln + '" target="_blank" rel="noopener" style="color:var(--accent);">Map</a>';
}

function applyVisitsFilters(visitRows) {
  const search = (document.getElementById('visitsSearch').value || '').trim().toLowerCase();
  const startVal = document.getElementById('visitsStart').value;
  const endVal = document.getElementById('visitsEnd').value;
  const minHours = parseFloat(document.getElementById('visitsMinHours').value);

  const start = startVal ? new Date(startVal + 'T00:00:00') : null;
  const end = endVal ? new Date(endVal + 'T23:59:59') : null;

  return visitRows.filter(v => {
    const arrival = new Date(v['Arrival Time']);
    if (start && arrival < start) return false;
    if (end && arrival > end) return false;

    if (search) {
      const haystack = ((v['Trailer Name'] || '') + ' ' + (v['Trailer ID'] || '')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }

    if (!isNaN(minHours) && minHours > 0) {
      const h = parseFloat(v['Duration (hrs)']) || 0;
      if (h < minHours) return false;
    }

    return true;
  }).sort((a, b) => new Date(b['Arrival Time']) - new Date(a['Arrival Time']));
}

function renderVisitsTable(visitRows) {
  const wrap = document.getElementById('visitsTableWrap');
  const filtered = applyVisitsFilters(visitRows);
  lastFilteredVisits = filtered;

  updateFilterCount('visitsFilterCount', filtered.length, visitRows.length);

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty-state">' +
      (visitRows.length ? 'No visits match the current filters.' : 'No completed visits logged yet.') +
      '</div>';
    return;
  }

  let html = '<table><thead><tr>' +
    '<th>Trailer</th><th>Visit #</th><th>Arrived</th><th>Departed</th><th>Duration</th>' +
    '<th>Arrival Pos.</th><th>Departure Pos.</th>' +
    '</tr></thead><tbody>';

  filtered.forEach(v => {
    html += '<tr>' +
      '<td>' + (v['Trailer Name'] || v['Trailer ID']) + '</td>' +
      '<td>' + (v['Visit #'] || '') + '</td>' +
      '<td>' + fmtDateTime(v['Arrival Time']) + '</td>' +
      '<td>' + fmtDateTime(v['Departure Time (Confirmed On-Site)']) + '</td>' +
      '<td><span class="dwell-badge ' + dwellClass(v['Duration (hrs)']) + '">' + hoursLabel(v['Duration (hrs)']) + '</span></td>' +
      '<td>' + mapLink_(v['Arrival Latitude'], v['Arrival Longitude']) + '</td>' +
      '<td>' + mapLink_(v['Departure Latitude'], v['Departure Longitude']) + '</td>' +
      '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function updateFilterCount(elId, shown, total) {
  let el = document.getElementById(elId);
  if (!el) return;
  el.textContent = (shown === total)
    ? total + (total === 1 ? ' record' : ' records')
    : 'Showing ' + shown + ' of ' + total + ' records';
}

function showError(msg) {
  const banner = document.getElementById('errorBanner');
  banner.textContent = msg;
  banner.classList.remove('hidden');
}

function clearError() {
  document.getElementById('errorBanner').classList.add('hidden');
}

// ---- CSV export (client-side, no backend involved) ----
function csvEscape(val) {
  const s = (val === null || val === undefined) ? '' : String(val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCSV(filename, headers, rows) {
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(row => {
    lines.push(headers.map(h => csvEscape(row[h])).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function todayStamp() {
  return new Date().toISOString().slice(0, 10);
}

document.getElementById('exportOnSiteBtn').addEventListener('click', () => {
  if (!lastFilteredOnSite.length) return;

  const sorted = [...lastFilteredOnSite].sort((a, b) => {
    let av = a[sortState.key], bv = b[sortState.key];
    if (sortState.key === 'Hours On Site') { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; }
    if (av < bv) return sortState.dir === 'asc' ? -1 : 1;
    if (av > bv) return sortState.dir === 'asc' ? 1 : -1;
    return 0;
  });

  downloadCSV(
    'pernod-on-site-' + todayStamp() + '.csv',
    ['Trailer ID', 'Trailer Name', 'Arrival Time', 'Hours On Site', 'Latitude', 'Longitude', 'Last Seen'],
    sorted
  );
});

document.getElementById('exportDwellLogBtn').addEventListener('click', () => {
  if (!lastFilteredDeparted.length) return;

  downloadCSV(
    'pernod-dwell-log-filtered-' + todayStamp() + '.csv',
    ['Trailer ID', 'Trailer Name', 'Event Type', 'Event Time', 'Duration (hrs)', 'Latitude', 'Longitude', 'Notes'],
    lastFilteredDeparted
  );
});

document.getElementById('exportDwellLogFullBtn').addEventListener('click', () => {
  if (!lastDwellLog.length) return;

  downloadCSV(
    'pernod-dwell-log-full-' + todayStamp() + '.csv',
    ['Trailer ID', 'Trailer Name', 'Event Type', 'Event Time', 'Duration (hrs)', 'Latitude', 'Longitude', 'Notes', 'Last Confirmed On-Site'],
    lastDwellLog
  );
});

document.getElementById('exportVisitsBtn').addEventListener('click', () => {
  if (!lastFilteredVisits.length) return;

  downloadCSV(
    'pernod-visits-filtered-' + todayStamp() + '.csv',
    ['Trailer ID', 'Trailer Name', 'Visit #', 'Arrival Time', 'Departure Time (Confirmed On-Site)', 'Departure Detected At', 'Duration (hrs)', 'Arrival Latitude', 'Arrival Longitude', 'Departure Latitude', 'Departure Longitude'],
    lastFilteredVisits
  );
});

document.getElementById('exportVisitsFullBtn').addEventListener('click', () => {
  if (!lastVisits.length) return;

  downloadCSV(
    'pernod-visits-full-' + todayStamp() + '.csv',
    ['Trailer ID', 'Trailer Name', 'Visit #', 'Arrival Time', 'Departure Time (Confirmed On-Site)', 'Departure Detected At', 'Duration (hrs)', 'Arrival Latitude', 'Arrival Longitude', 'Departure Latitude', 'Departure Longitude'],
    lastVisits
  );
});

// ---- Filter wiring ----
document.getElementById('onsiteSearch').addEventListener('input', () => renderOnSiteTable(lastTrailers));
document.getElementById('onsiteMinHours').addEventListener('input', () => renderOnSiteTable(lastTrailers));
document.getElementById('onsiteClearFilters').addEventListener('click', () => {
  document.getElementById('onsiteSearch').value = '';
  document.getElementById('onsiteMinHours').value = '';
  renderOnSiteTable(lastTrailers);
});

document.getElementById('departedSearch').addEventListener('input', () => renderDepartedTable(lastDwellLog));
document.getElementById('departedStart').addEventListener('change', () => renderDepartedTable(lastDwellLog));
document.getElementById('departedEnd').addEventListener('change', () => renderDepartedTable(lastDwellLog));
document.getElementById('departedMinHours').addEventListener('input', () => renderDepartedTable(lastDwellLog));
document.getElementById('departedClearFilters').addEventListener('click', () => {
  document.getElementById('departedSearch').value = '';
  document.getElementById('departedMinHours').value = '';
  setDefaultDateRange();
  renderDepartedTable(lastDwellLog);
});

document.getElementById('visitsSearch').addEventListener('input', () => renderVisitsTable(lastVisits));
document.getElementById('visitsStart').addEventListener('change', () => renderVisitsTable(lastVisits));
document.getElementById('visitsEnd').addEventListener('change', () => renderVisitsTable(lastVisits));
document.getElementById('visitsMinHours').addEventListener('input', () => renderVisitsTable(lastVisits));
document.getElementById('visitsClearFilters').addEventListener('click', () => {
  document.getElementById('visitsSearch').value = '';
  document.getElementById('visitsMinHours').value = '';
  setDefaultVisitsDateRange();
  renderVisitsTable(lastVisits);
});

function setDefaultDateRange() {
  const end = new Date();
  const start = new Date(Date.now() - 7 * 24 * 3600000);
  document.getElementById('departedEnd').value = end.toISOString().slice(0, 10);
  document.getElementById('departedStart').value = start.toISOString().slice(0, 10);
}
setDefaultDateRange();

// Visits defaults to a 14-day window rather than 7 — disputes about a
// trailer that "came back" often span longer than a week, so this tab
// starts a bit wider than Recently Departed.
function setDefaultVisitsDateRange() {
  const end = new Date();
  const start = new Date(Date.now() - 14 * 24 * 3600000);
  document.getElementById('visitsEnd').value = end.toISOString().slice(0, 10);
  document.getElementById('visitsStart').value = start.toISOString().slice(0, 10);
}
setDefaultVisitsDateRange();

async function loadData() {
  document.getElementById('lastUpdated').textContent = 'Refreshing...';

  try {
    const [trailers, dwellLog, visitRows] = await Promise.all([
      fetchCSV(CURRENT_STATUS_CSV_URL),
      fetchCSV(DWELL_LOG_CSV_URL),
      fetchCSV(VISITS_CSV_URL)
    ]);

    clearError();
    lastTrailers = trailers;
    lastDwellLog = dwellLog;
    lastVisits = visitRows;
    renderStats(trailers);
    updateMap(trailers);
    renderOnSiteTable(trailers);
    renderDepartedTable(dwellLog);
    renderVisitsTable(visitRows);

    document.getElementById('lastUpdated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  } catch (e) {
    showError('Could not load data: ' + e.message + '. Check that all three sheets are published to web as CSV and the URLs in the code are correct.');
    document.getElementById('lastUpdated').textContent = 'Update failed';
  }
}

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('onsiteSection').classList.toggle('hidden', tab !== 'onsite');
    document.getElementById('departedSection').classList.toggle('hidden', tab !== 'departed');
    document.getElementById('visitsSection').classList.toggle('hidden', tab !== 'visits');
    document.getElementById('mapSection').classList.toggle('hidden', tab !== 'map');

    if (tab === 'map' && map) {
      // Leaflet sizes itself off its container at init time. Since the map
      // tab starts hidden (display:none has zero size), the map renders
      // broken/cut-off until told to recheck its size once it's actually
      // visible on screen.
      setTimeout(() => {
        map.invalidateSize();
        if (lastTrailers.length) {
          const pts = lastTrailers
            .map(t => [parseFloat(t['Latitude']), parseFloat(t['Longitude'])])
            .filter(p => !isNaN(p[0]) && !isNaN(p[1]));
          if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 });
        }
      }, 50);
    }
  });
});

document.getElementById('refreshBtn').addEventListener('click', loadData);

// ---- Theme toggle (light by default, persisted per-device) ----
const themeToggle = document.getElementById('themeToggle');

function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.textContent = 'Light';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = 'Dark';
  }
}

const savedTheme = localStorage.getItem('pernodDwellTheme') || 'light';
applyTheme(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('pernodDwellTheme', next);
  applyTheme(next);
});

// ---- Init ----
initMap();
loadData();
setInterval(loadData, REFRESH_INTERVAL_MS);

// ---- PWA install support ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

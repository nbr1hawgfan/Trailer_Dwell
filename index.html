<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pernod Ricard Trailer Dwell</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0f2a4d">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f5f6f8;
    --bg-card: #ffffff;
    --border: #d7dce2;
    --text: #10151f;
    --text-dim: #5a6572;
    --accent: #1f4e8c;
    --accent-strong: #0f2a4d;
    --accent-text: #ffffff;
    --good: #1f7a4d;
    --warn: #a5690c;
    --bad: #b3261e;
    --good-bg: rgba(31,122,77,0.08);
    --warn-bg: rgba(165,105,12,0.08);
    --bad-bg: rgba(179,38,30,0.08);
    --radius: 4px;
    --mono: ui-monospace, 'SF Mono', 'Roboto Mono', 'Courier New', monospace;
  }

  [data-theme="dark"] {
    --bg: #0d1117;
    --bg-card: #151b24;
    --border: #2a323d;
    --text: #e7eaee;
    --text-dim: #8b94a0;
    --accent: #5b90d6;
    --accent-strong: #0a1420;
    --accent-text: #ffffff;
    --good: #3fa76b;
    --warn: #d69a34;
    --bad: #e2564c;
    --good-bg: rgba(63,167,107,0.12);
    --warn-bg: rgba(214,154,52,0.12);
    --bad-bg: rgba(226,86,76,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding-bottom: 40px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--accent-strong);
    padding: 14px 20px 16px 20px;
    position: sticky;
    top: 0;
    z-index: 500;
    border-bottom: 2px solid var(--accent);
  }

  header .eyebrow {
    color: rgba(255,255,255,0.55);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin-bottom: 3px;
  }

  header h1 {
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header .subtitle {
    color: rgba(255,255,255,0.62);
    font-size: 12px;
    margin-top: 2px;
    font-family: var(--mono);
  }

  .stats-bar {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin: 16px 20px 8px 20px;
    border-radius: var(--radius);
    overflow: hidden;
  }

  .stat-card {
    background: var(--bg-card);
    padding: 12px 16px;
    flex: 1;
    min-width: 100px;
  }

  .stat-card .value {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  .stat-card .label {
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 5px;
  }


  .stat-card.warn .value { color: var(--warn); }
  .stat-card.bad .value { color: var(--bad); }

  #map {
    height: 460px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: #2a2a2a;
  }

  .section {
    padding: 20px;
  }

  .section h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    margin-top: 4px;
    color: var(--text);
  }

  .tabs {
    display: flex;
    gap: 2px;
    padding: 0 20px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .tab-btn.active {
    color: var(--accent-strong);
    border-bottom-color: var(--accent);
  }

  [data-theme="dark"] .tab-btn.active { color: var(--text); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  th {
    text-align: left;
    padding: 9px 12px;
    background: var(--bg);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
  }

  th:hover { color: var(--text); }

  td {
    padding: 11px 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
  }

  tr:hover td { background: rgba(31,78,140,0.04); }
  [data-theme="dark"] tr:hover td { background: rgba(91,144,214,0.06); }

  .dwell-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 8px 3px 7px;
    border-radius: 2px;
    font-size: 12px;
    font-weight: 700;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    border-left: 3px solid;
  }

  .dwell-good { background: var(--good-bg); color: var(--good); border-left-color: var(--good); }
  .dwell-warn { background: var(--warn-bg); color: var(--warn); border-left-color: var(--warn); }
  .dwell-bad { background: var(--bad-bg); color: var(--bad); border-left-color: var(--bad); }
  .dwell-neutral { background: var(--bg); color: var(--text-dim); border-left-color: var(--border); }

  .source-tag {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 2px;
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    margin-left: 6px;
    vertical-align: middle;
  }

  .load-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 2px;
  }

  .load-tag.empty { background: rgba(31,78,140,0.1); color: var(--accent); }
  .load-tag.loaded { background: var(--good-bg); color: var(--good); }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
  }

  .refresh-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px 0 20px;
  }

  .refresh-row .last-updated {
    color: var(--text-dim);
    font-size: 11px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .refresh-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 13px;
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
  [data-theme="dark"] .refresh-btn:hover { color: var(--text); }
  .refresh-btn:active { transform: scale(0.98); }

  .export-row {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .filter-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 12px 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .filter-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    flex: 1;
    min-width: 160px;
  }

  .filter-input:focus, .filter-input-small:focus {
    outline: none;
    border-color: var(--accent);
  }

  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .filter-field label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .filter-input-small {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: var(--radius);
    font-size: 13px;
    width: 130px;
  }

  .filter-count {
    color: var(--text-dim);
    font-size: 11px;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: -4px 0 10px 2px;
  }

  .theme-toggle {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.28);
    color: rgba(255,255,255,0.85);
    padding: 5px 11px;
    border-radius: var(--radius);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
  }

  .theme-toggle:hover { border-color: #ffffff; color: #ffffff; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .hidden { display: none; }

  .error-banner {
    margin: 20px;
    padding: 14px 16px;
    background: var(--bad-bg);
    border: 1px solid var(--bad);
    border-left: 3px solid var(--bad);
    border-radius: var(--radius);
    color: var(--bad);
    font-size: 13px;
  }

  @media (max-width: 480px) {
    #map { height: 340px; }
    th, td { font-size: 12px; padding: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div>
      <div class="eyebrow">Trailer Dwell Tracking</div>
      <h1>Pernod Ricard — Fort Smith</h1>
      <div class="subtitle">7401 State Hwy 45, Fort Smith, AR 72916</div>
    </div>
    <button class="theme-toggle" id="themeToggle">Dark</button>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="refresh-row">
  <span class="last-updated" id="lastUpdated">Loading...</span>
  <button class="refresh-btn" id="refreshBtn">Refresh</button>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="onsite">On Site</button>
  <button class="tab-btn" data-tab="departed">Recently Departed</button>
  <button class="tab-btn" data-tab="visits">Visits</button>
  <button class="tab-btn" data-tab="locations">Locations</button>
  <button class="tab-btn" data-tab="analytics">Analytics</button>
  <button class="tab-btn" data-tab="map">Map</button>
</div>

<div class="section" id="onsiteSection">
  <div class="filter-row">
    <input type="text" id="onsiteSearch" class="filter-input" placeholder="Search trailer name or ID...">
    <div class="filter-field">
      <label for="onsiteMinHours">Min hours on site</label>
      <input type="number" id="onsiteMinHours" class="filter-input-small" min="0" step="1" placeholder="0">
    </div>
    <button class="refresh-btn" id="onsiteClearFilters">Clear</button>
  </div>
  <div class="filter-count" id="onsiteFilterCount"></div>
  <div class="export-row">
    <button class="refresh-btn" id="exportOnSiteBtn">Export CSV</button>
  </div>
  <div id="onsiteTableWrap"></div>
</div>

<div class="section hidden" id="departedSection">
  <div class="filter-row">
    <input type="text" id="departedSearch" class="filter-input" placeholder="Search trailer name or ID...">
    <div class="filter-field">
      <label for="departedStart">From</label>
      <input type="date" id="departedStart" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="departedEnd">To</label>
      <input type="date" id="departedEnd" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="departedMinHours">Min dwell (hrs)</label>
      <input type="number" id="departedMinHours" class="filter-input-small" min="0" step="1" placeholder="0">
    </div>
    <button class="refresh-btn" id="departedClearFilters">Clear</button>
  </div>
  <div class="filter-count" id="departedFilterCount"></div>
  <div class="export-row">
    <button class="refresh-btn" id="exportDwellLogBtn">Export Filtered CSV</button>
    <button class="refresh-btn" id="exportDwellLogFullBtn">Export Full History CSV</button>
  </div>
  <div id="departedTableWrap"></div>
</div>

<div class="section hidden" id="visitsSection">
  <div class="filter-row">
    <input type="text" id="visitsSearch" class="filter-input" placeholder="Search trailer name or ID...">
    <div class="filter-field">
      <label for="visitsStart">From</label>
      <input type="date" id="visitsStart" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="visitsEnd">To</label>
      <input type="date" id="visitsEnd" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="visitsMinHours">Min duration (hrs)</label>
      <input type="number" id="visitsMinHours" class="filter-input-small" min="0" step="1" placeholder="0">
    </div>
    <button class="refresh-btn" id="visitsClearFilters">Clear</button>
  </div>
  <div class="filter-count" id="visitsFilterCount"></div>
  <div class="export-row">
    <button class="refresh-btn" id="exportVisitsBtn">Export Filtered CSV</button>
    <button class="refresh-btn" id="exportVisitsFullBtn">Export Full History CSV</button>
  </div>
  <div id="visitsTableWrap"></div>
</div>

<div class="section hidden" id="locationsSection">
  <div class="filter-row">
    <input type="text" id="locationsSearch" class="filter-input" placeholder="Search trailer name or ID...">
    <div class="filter-field">
      <label for="locationsStatusFilter">Status</label>
      <select id="locationsStatusFilter" class="filter-input-small">
        <option value="">All</option>
        <option value="At Pernod Ricard">At Pernod Ricard</option>
        <option value="At Warehouse">At a Warehouse</option>
        <option value="Elsewhere - Unaccounted">Elsewhere — Unaccounted</option>
        <option value="No Recent GPS">No Recent GPS</option>
      </select>
    </div>
    <button class="refresh-btn" id="locationsClearFilters">Clear</button>
  </div>
  <div class="filter-count" id="locationsFilterCount"></div>
  <div class="export-row">
    <button class="refresh-btn" id="exportLocationsBtn">Export CSV</button>
  </div>
  <div id="locationsTableWrap"></div>
</div>

<div class="section hidden" id="analyticsSection">
  <div class="filter-row">
    <div class="filter-field">
      <label for="analyticsMonth">Month</label>
      <input type="month" id="analyticsMonth" class="filter-input-small">
    </div>
    <div class="filter-field">
      <label for="analyticsThreshold">Flag over (hrs)</label>
      <input type="number" id="analyticsThreshold" class="filter-input-small" min="1" step="1" value="48">
    </div>
    <button class="refresh-btn" id="analyticsAllTime">All-Time View</button>
  </div>

  <div class="stats-bar" id="analyticsStatsBar" style="margin:0 0 16px 0;"></div>

  <h2>Average Dwell Time — Last 6 Months</h2>
  <div id="analyticsTrendChart" style="margin-bottom:20px;"></div>

  <h2>Longest Visits <span id="analyticsScopeLabel1" style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:normal;"></span></h2>
  <div class="export-row">
    <button class="refresh-btn" id="exportLongestBtn">Export CSV</button>
  </div>
  <div id="longestVisitsWrap" style="margin-bottom:20px;"></div>

  <h2>Per-Trailer Summary <span id="analyticsScopeLabel2" style="color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:normal;"></span></h2>
  <div class="export-row">
    <button class="refresh-btn" id="exportTrailerSummaryBtn">Export CSV</button>
  </div>
  <div id="trailerSummaryWrap"></div>
</div>

<div class="section hidden" id="mapSection">
  <div id="map"></div>
</div>

<div id="errorBanner" class="error-banner hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ============================================================
// CONFIG — paste your two published-CSV URLs here
// File > Share > Publish to web, per-sheet, format CSV, on the
// "Current Status" and "Dwell Log" tabs.
// ============================================================
const CURRENT_STATUS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxbZXyc8eN8KxGAA-eLkghoFHpPkeFdrUFCm9xrlaJtfmaJM-HBPA8cjRvQ5Kh9ySdiw3Wm9OSYpT/pub?gid=450264095&single=true&output=csv';
const DWELL_LOG_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxbZXyc8eN8KxGAA-eLkghoFHpPkeFdrUFCm9xrlaJtfmaJM-HBPA8cjRvQ5Kh9ySdiw3Wm9OSYpT/pub?gid=947795419&single=true&output=csv';
const VISITS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxbZXyc8eN8KxGAA-eLkghoFHpPkeFdrUFCm9xrlaJtfmaJM-HBPA8cjRvQ5Kh9ySdiw3Wm9OSYpT/pub?gid=1735900058&single=true&output=csv';
const LOCATIONS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmxbZXyc8eN8KxGAA-eLkghoFHpPkeFdrUFCm9xrlaJtfmaJM-HBPA8cjRvQ5Kh9ySdiw3Wm9OSYpT/pub?gid=1680316946&single=true&output=csv';

// Trailers hidden everywhere in this app — currently under a separate paid
// storage arrangement, per management. Remove an id here (and from
// PAID_STORAGE_TRAILER_IDS in the backend's Config.gs) when a trailer goes
// back to being a regular transfer trailer. Matches the backend list.
const HIDDEN_TRAILER_IDS = [
  
  '212014918337328'  // 016-W
];

function isHiddenTrailer(id) {
  return HIDDEN_TRAILER_IDS.includes(String(id));
}

const SITE_CENTER = { lat: 35.3122, lng: -94.3843 }; // approx Pernod Ricard yard
const REFRESH_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes
const WARN_HOURS = 24;
const BAD_HOURS = 48;

// ---- CSV parsing (handles quoted fields with commas) ----
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }

  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.some(c => c && c.trim())).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] || '').trim());
    return obj;
  });
}

async function fetchCSV(url) {
  const resp = await fetch(url + (url.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
  if (!resp.ok) throw new Error('Fetch failed: ' + resp.status);
  const text = await resp.text();
  return parseCSV(text);
}

function hoursLabel(h) {
  const n = parseFloat(h);
  if (isNaN(n)) return '—';
  const hrs = Math.floor(n);
  const mins = Math.round((n - hrs) * 60);
  return hrs + 'h ' + mins + 'm';
}

function dwellClass(hours) {
  const n = parseFloat(hours);
  if (isNaN(n)) return 'dwell-good';
  if (n >= BAD_HOURS) return 'dwell-bad';
  if (n >= WARN_HOURS) return 'dwell-warn';
  return 'dwell-good';
}

function fmtDateTime(d) {
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d || '—';
  return dt.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

let map, markersLayer;

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([SITE_CENTER.lat, SITE_CENTER.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

function colorForHours(hours) {
  const n = parseFloat(hours);
  if (isNaN(n)) return '#1f7a4d';
  if (n >= BAD_HOURS) return '#b3261e';
  if (n >= WARN_HOURS) return '#a5690c';
  return '#1f7a4d';
}

function updateMap(trailers) {
  markersLayer.clearLayers();

  trailers.forEach(t => {
    const lat = parseFloat(t['Latitude']);
    const lng = parseFloat(t['Longitude']);
    if (isNaN(lat) || isNaN(lng)) return;

    const color = colorForHours(t['Hours On Site']);
    const marker = L.circleMarker([lat, lng], {
      radius: 9,
      fillColor: color,
      color: '#121212',
      weight: 2,
      fillOpacity: 0.9
    });

    marker.bindPopup(
      '<strong>' + t['Trailer Name'] + '</strong><br>' +
      'On site: ' + hoursLabel(t['Hours On Site']) + '<br>' +
      'Arrived: ' + fmtDateTime(t['Arrival Time'])
    );

    marker.addTo(markersLayer);
  });

  if (trailers.length) {
    const validPts = trailers

    if (validPts.length) {
      map.fitBounds(validPts, { padding: [40, 40], maxZoom: 17 });
    }
  }
}

function applyOnSiteFilters(trailers) {
  const search = (document.getElementById('onsiteSearch').value || '').trim().toLowerCase();

  return trailers.filter(t => {

      if (!haystack.includes(search)) return false;
    }
    if (!isNaN(minHours) && minHours > 0) {

function applyDepartedFilters(dwellLog) {
  const search = (document.getElementById('departedSearch').value || '').trim().toLowerCase();
  const startVal = document.getElementById('departedStart').value;
  const endVal = document.getElementById('departedEnd').value;
  const minHours = parseFloat(document.getElementById('departedMinHours').value);

  const start = startVal ? new Date(startVal + 'T00:00:00') : null;
  const end = endVal ? new Date(endVal + 'T23:59:59') : null;

  return dwellLog.filter(r => {
    if (r['Event Type'] !== 'Departure') return false;

    const eventTime = new Date(r['Event Time']);
    if (start && eventTime < start) return false;
    if (end && eventTime > end) return false;

    if (search) {
      const haystack = ((r['Trailer Name'] || '') + ' ' + (r['Trailer ID'] || '')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }

    if (!isNaN(minHours) && minHours > 0) {
      const h = parseFloat(r['Duration (hrs)']) || 0;
      if (h < minHours) return false;
    }

    return true;
  }).sort((a, b) => new Date(b['Event Time']) - new Date(a['Event Time']));
}

// ---- CSV export (client-side, no backend involved) ----
function csvEscape(val) {
  const s = (val === null || val === undefined) ? '' : String(val);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCSV(filename, headers, rows) {
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(row => {
    lines.push(headers.map(h => csvEscape(row[h])).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function hoursSince_(dateStr, now) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return NaN;
  return (now - d) / 3600000;
}

function locationBadgeClass_(status, hoursSinceStatus) {
  if (status === 'Elsewhere - Unaccounted' || status === 'No Recent GPS') {
    if (hoursSinceStatus >= BAD_HOURS) return 'dwell-bad';
    if (hoursSinceStatus >= WARN_HOURS) return 'dwell-warn';
    return 'dwell-neutral';
  }
  return 'dwell-neutral'; // At Pernod Ricard / At a warehouse — informational, not a red flag
}

function applyLocationsFilters(locations) {
  const search = (document.getElementById('locationsSearch').value || '').trim().toLowerCase();
  const statusFilter = document.getElementById('locationsStatusFilter').value;

  return locations.filter(l => {
    if (search) {
      const haystack = ((l['Trailer Name'] || '') + ' ' + (l['Trailer ID'] || '')).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    if (statusFilter === 'At Warehouse') {
      if (!(l['Current Status'] || '').startsWith('At ') || l['Current Status'] === 'At Pernod Ricard') return false;
    } else if (statusFilter && l['Current Status'] !== statusFilter) {
      return false;
    }
    return true;
  }).sort((a, b) => new Date(b['Status Since']) - new Date(a['Status Since']));
}

function renderLocationsTable(locations) {
  const wrap = document.getElementById('locationsTableWrap');
  if (!wrap) return; // guard in case loadData fires before DOM is ready

  const filtered = applyLocationsFilters(locations);
  lastFilteredLocations = filtered;
  updateFilterCount('locationsFilterCount', filtered.length, locations.length);

  if (!filtered.length) {
    wrap.innerHTML = '<div class="empty-state">' +
      (locations.length ? 'No trailers match the current filters.' : 'No location data yet — this fills in automatically once trailers with Pernod history get polled again.') +
      '</div>';
    return;
  }

  const now = new Date();

  let html = '<table><thead><tr>' +
    '<th>Trailer</th><th>Current Status</th><th>Since</th><th>Last Ping</th><th>Position</th>' +
    '</tr></thead><tbody>';

  filtered.forEach(l => {
    const hrs = hoursSince_(l['Status Since'], now);
    const badgeClass = locationBadgeClass_(l['Current Status'], hrs);
    html += '<tr>' +
      '<td>' + (l['Trailer Name'] || l['Trailer ID']) + '</td>' +
      '<td>' + l['Current Status'] + '</td>' +
      '<td><span class="dwell-badge ' + badgeClass + '">' + (isNaN(hrs) ? '—' : hoursLabel(hrs)) + '</span></td>' +
      '<td>' + fmtDateTime(l['Last Ping Time']) + '</td>' +
      '<td>' + mapLink_(l['Last Known Latitude'], l['Last Known Longitude']) + '</td>' +
      '</tr>';
  });

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function monthKey_(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return null;
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function monthLabel_(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
}

function last6MonthKeys_() {
  const keys = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    keys.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  return keys;
}

function renderTrendChart(visits) {
  const wrap = document.getElementById('analyticsTrendChart');
  const keys = last6MonthKeys_();

  const monthlyAvg = keys.map(key => {
    const inMonth = visits.filter(v => monthKey_(v['Arrival Time']) === key);
    const hours = inMonth.map(v => parseFloat(v['Duration (hrs)'])).filter(n => !isNaN(n));
    const avg = hours.length ? hours.reduce((a, b) => a + b, 0) / hours.length : 0;
    return { key, avg, count: inMonth.length };
  });

  const maxAvg = Math.max(...monthlyAvg.map(m => m.avg), 1);
  const barW = 100 / keys.length;

  let bars = '';
  monthlyAvg.forEach((m, i) => {
    const heightPct = m.avg > 0 ? Math.max((m.avg / maxAvg) * 100, 3) : 0;
    const x = i * barW;
    const barColor = m.avg >= 48 ? 'var(--bad)' : m.avg >= 24 ? 'var(--warn)' : 'var(--accent)';
    bars += `
      <div style="position:absolute; left:${x}%; bottom:0; width:${barW}%; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:0 6px;">
        <div style="font-family:var(--mono); font-size:11px; font-weight:600; color:var(--text); margin-bottom:4px;">${m.avg > 0 ? hoursLabel(m.avg) : '—'}</div>
        <div style="width:100%; max-width:48px; height:${heightPct}%; background:${barColor}; border-radius:2px 2px 0 0; min-height:${m.avg > 0 ? '2px' : '0'};"></div>
        <div style="font-size:10px; color:var(--text-dim); margin-top:6px; text-transform:uppercase; letter-spacing:0.03em;">${monthLabel_(m.key)}</div>
        <div style="font-family:var(--mono); font-size:9px; color:var(--text-dim);">${m.count} visit${m.count === 1 ? '' : 's'}</div>
      </div>`;
  });

  wrap.innerHTML = `
    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 12px 12px 12px;">
      <div style="position:relative; height:160px;">${bars}</div>
    </div>`;
}

function getAnalyticsScope() {
  const monthVal = document.getElementById('analyticsMonth').value;
  const allTime = document.getElementById('analyticsMonth').dataset.allTime === 'true';
  if (allTime || !monthVal) return { visits: lastVisits, label: allTime ? '(All-Time)' : '' };
  return {
    visits: lastVisits.filter(v => monthKey_(v['Arrival Time']) === monthVal),
    label: '(' + monthLabel_(monthVal) + ')'
  };
}

function renderAnalyticsStats(visits, threshold) {
  const bar = document.getElementById('analyticsStatsBar');
  const uniqueTrailers = new Set(visits.map(v => v['Trailer ID'])).size;
  const totalVisits = visits.length;
  const hours = visits.map(v => parseFloat(v['Duration (hrs)'])).filter(n => !isNaN(n));
  const totalHours = hours.reduce((a, b) => a + b, 0);
  const trailerDays = totalHours / 24;
  const avgHours = hours.length ? totalHours / hours.length : 0;
  const overThreshold = hours.filter(h => h >= threshold).length;
  const overPct = totalVisits ? Math.round((overThreshold / totalVisits) * 100) : 0;

  bar.innerHTML = `
    <div class="stat-card">
      <div class="value">${uniqueTrailers}</div>
      <div class="label">Unique Trailers</div>
    </div>
    <div class="stat-card">
      <div class="value">${totalVisits}</div>
      <div class="label">Total Visits</div>
    </div>
    <div class="stat-card">
      <div class="value">${trailerDays.toFixed(1)}</div>
      <div class="label">Trailer-Days Tied Up</div>
    </div>
    <div class="stat-card">
      <div class="value">${hoursLabel(avgHours)}</div>
      <div class="label">Avg Dwell / Visit</div>
    </div>
    <div class="stat-card ${overPct > 25 ? 'bad' : overPct > 0 ? 'warn' : ''}">
      <div class="value">${overPct}%</div>
      <div class="label">Over ${threshold}h (${overThreshold})</div>
    </div>
  `;
}

function renderLongestVisits(visits) {
  const wrap = document.getElementById('longestVisitsWrap');
  const sorted = [...visits]
    .filter(v => !isNaN(parseFloat(v['Duration (hrs)'])))
    .sort((a, b) => parseFloat(b['Duration (hrs)']) - parseFloat(a['Duration (hrs)']))
    .slice(0, 10);

  lastLongestVisits = sorted;

  if (!sorted.length) {
    wrap.innerHTML = '<div class="empty-state">No visits in this scope yet.</div>';
    return;
  }

  let html = '<table><thead><tr><th>Trailer</th><th>Arrived</th><th>Departed</th><th>Duration</th></tr></thead><tbody>';
  sorted.forEach(v => {
    html += '<tr>' +
      '<td>' + (v['Trailer Name'] || v['Trailer ID']) + '</td>' +
      '<td>' + fmtDateTime(v['Arrival Time']) + '</td>' +
      '<td>' + fmtDateTime(v['Departure Time (Confirmed On-Site)']) + '</td>' +
      '<td><span class="dwell-badge ' + dwellClass(v['Duration (hrs)']) + '">' + hoursLabel(v['Duration (hrs)']) + '</span></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function renderTrailerSummary(visits) {
  const wrap = document.getElementById('trailerSummaryWrap');
  const byTrailer = {};

  visits.forEach(v => {
    const id = v['Trailer ID'];
    const dur = parseFloat(v['Duration (hrs)']);
    if (!byTrailer[id]) byTrailer[id] = { id, name: v['Trailer Name'] || id, visits: 0, totalHours: 0 };
    byTrailer[id].visits++;
    if (!isNaN(dur)) byTrailer[id].totalHours += dur;
  });

  const rows = Object.values(byTrailer)
    .map(t => ({ ...t, avgHours: t.totalHours / t.visits }))
    .sort((a, b) => b.totalHours - a.totalHours);

  lastTrailerSummary = rows;

  if (!rows.length) {
    wrap.innerHTML = '<div class="empty-state">No visits in this scope yet.</div>';
    return;
  }

  let html = '<table><thead><tr><th>Trailer</th><th>Visits</th><th>Total Hours</th><th>Avg / Visit</th></tr></thead><tbody>';
  rows.forEach(t => {
    html += '<tr>' +
      '<td>' + t.name + '</td>' +
      '<td style="font-family:var(--mono);">' + t.visits + '</td>' +
      '<td style="font-family:var(--mono);">' + hoursLabel(t.totalHours) + '</td>' +
      '<td><span class="dwell-badge ' + dwellClass(t.avgHours) + '">' + hoursLabel(t.avgHours) + '</span></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function renderAnalytics() {
  const threshold = parseFloat(document.getElementById('analyticsThreshold').value) || 48;
  const scope = getAnalyticsScope();

  document.getElementById('analyticsScopeLabel1').textContent = scope.label;
  document.getElementById('analyticsScopeLabel2').textContent = scope.label;

  renderAnalyticsStats(scope.visits, threshold);
  renderTrendChart(lastVisits); // trend always shows full 6-month history regardless of scope
  renderLongestVisits(scope.visits);
  renderTrailerSummary(scope.visits);
}

function setDefaultAnalyticsMonth() {
  const now = new Date();
  document.getElementById('analyticsMonth').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
}
setDefaultAnalyticsMonth();

document.getElementById('analyticsMonth').addEventListener('change', () => {
  document.getElementById('analyticsMonth').dataset.allTime = 'false';
  renderAnalytics();
});
document.getElementById('analyticsThreshold').addEventListener('input', renderAnalytics);
document.getElementById('analyticsAllTime').addEventListener('click', () => {
  const el = document.getElementById('analyticsMonth');
  const isAllTime = el.dataset.allTime === 'true';
  el.dataset.allTime = isAllTime ? 'false' : 'true';
  document.getElementById('analyticsAllTime').textContent = isAllTime ? 'All-Time View' : 'Back to Month View';
  renderAnalytics();
});

document.getElementById('exportLongestBtn').addEventListener('click', () => {
  if (!lastLongestVisits.length) return;
  downloadCSV(
    'pernod-longest-visits-' + todayStamp() + '.csv',
    ['Trailer ID', 'Trailer Name', 'Visit #', 'Arrival Time', 'Departure Time (Confirmed On-Site)', 'Duration (hrs)'],
    lastLongestVisits
  );
});

document.getElementById('exportTrailerSummaryBtn').addEventListener('click', () => {
  if (!lastTrailerSummary.length) return;
  const rows = lastTrailerSummary.map(t => ({
    'Trailer ID': t.id,
    'Trailer Name': t.name,
    'Visits': t.visits,
    'Total Hours': Math.round(t.totalHours * 100) / 100,
    'Avg Hours Per Visit': Math.round(t.avgHours * 100) / 100
  }));
  downloadCSV(
    'pernod-trailer-summary-' + todayStamp() + '.csv',
    ['Trailer ID', 'Trailer Name', 'Visits', 'Total Hours', 'Avg Hours Per Visit'],
    rows
  );
});

async function loadData() {
  document.getElementById('lastUpdated').textContent = 'Refreshing...';

  try {
    const fetches = [
      fetchCSV(CURRENT_STATUS_CSV_URL),
      fetchCSV(DWELL_LOG_CSV_URL),
      fetchCSV(VISITS_CSV_URL)
    ];
    if (LOCATIONS_CSV_URL && !LOCATIONS_CSV_URL.startsWith('PASTE_')) {
      fetches.push(fetchCSV(LOCATIONS_CSV_URL));
    }

    const [trailersRaw, dwellLogRaw, visitRowsRaw, locationsRaw] = await Promise.all(fetches);

    // Hidden trailers (paid storage, etc.) are filtered out right here —
    // a single choke point so every tab, chart, and export downstream
    // never sees them, regardless of what's still in the underlying sheets.
    const trailers = trailersRaw.filter(r => !isHiddenTrailer(r['Trailer ID']));
    const dwellLog = dwellLogRaw.filter(r => !isHiddenTrailer(r['Trailer ID']));
    const visitRows = visitRowsRaw.filter(r => !isHiddenTrailer(r['Trailer ID']));
    const locations = (locationsRaw || []).filter(r => !isHiddenTrailer(r['Trailer ID']));

    clearError();
    lastTrailers = trailers;
    lastDwellLog = dwellLog;
    lastVisits = visitRows;
    lastLocations = locations;
    renderStats(trailers);
    updateMap(trailers);
    renderOnSiteTable(trailers);
    renderDepartedTable(dwellLog);
    renderVisitsTable(visitRows);
    renderAnalytics();
    renderLocationsTable(locations);

    document.getElementById('lastUpdated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  } catch (e) {
    showError('Could not load data: ' + e.message + '. Check that all three sheets are published to web as CSV and the URLs in the code are correct.');
    document.getElementById('lastUpdated').textContent = 'Update failed';
  }
}

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('onsiteSection').classList.toggle('hidden', tab !== 'onsite');
    document.getElementById('departedSection').classList.toggle('hidden', tab !== 'departed');
    document.getElementById('visitsSection').classList.toggle('hidden', tab !== 'visits');
    document.getElementById('locationsSection').classList.toggle('hidden', tab !== 'locations');
    document.getElementById('analyticsSection').classList.toggle('hidden', tab !== 'analytics');
    document.getElementById('mapSection').classList.toggle('hidden', tab !== 'map');

    if (tab === 'map' && map) {
      // Leaflet sizes itself off its container at init time. Since the map
      // tab starts hidden (display:none has zero size), the map renders
      // broken/cut-off until told to recheck its size once it's actually
      // visible on screen.
      setTimeout(() => {
        map.invalidateSize();
        if (lastTrailers.length) {
          const pts = lastTrailers
            .map(t => [parseFloat(t['Latitude']), parseFloat(t['Longitude'])])
            .filter(p => !isNaN(p[0]) && !isNaN(p[1]));
          if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 });
        }
      }, 50);
    }
  });
});

document.getElementById('refreshBtn').addEventListener('click', loadData);

// ---- Theme toggle (light by default, persisted per-device) ----
const themeToggle = document.getElementById('themeToggle');

function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.textContent = 'Light';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = 'Dark';
  }
}

const savedTheme = localStorage.getItem('pernodDwellTheme') || 'light';
applyTheme(savedTheme);

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('pernodDwellTheme', next);
  applyTheme(next);
});

// ---- Init ----
initMap();
loadData();
setInterval(loadData, REFRESH_INTERVAL_MS);

// ---- PWA install support ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
